<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — Agenda Sévigné</title>
<style>
:root{--b:#355f78;--p:#eef4f7;--i:#172126;--r:#982b38}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--i);background:#faf9f6}
main{max-width:820px;margin:auto;padding:22px 16px 60px}h1{font-family:Georgia,serif;color:var(--b);font-size:30px}
.card{background:white;border:1px solid #dfe7eb;border-radius:18px;padding:16px;margin:14px 0}
label{font-weight:700;display:block;margin-bottom:7px}input{width:100%;font-size:16px;padding:12px;border:1px solid #bbcbd3;border-radius:10px}
button,a.btn{appearance:none;border:0;border-radius:999px;background:var(--b);color:white;padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none;display:inline-block}
button.secondary{background:white;color:var(--b);border:1px solid var(--b)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.editor{min-height:220px;border:1px solid #bbcbd3;border-radius:12px;padding:14px;background:white;overflow:auto}
.editor:focus{outline:2px solid #8db0c2}.muted{color:#63747c;font-size:13px;line-height:1.4}
.status{font-weight:700;color:var(--r);min-height:24px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.toolbar button{padding:7px 11px;font-size:13px;background:var(--p);color:var(--b)}
</style></head><body><main>
<h1>Administration de l’Agenda</h1>
<p class="muted">Modifiez directement les textes. Les changements enregistrés apparaissent sur le site public sans modifier les fichiers GitHub.</p>
<div class="card"><label for="pw">Mot de passe administrateur</label><input id="pw" type="password" autocomplete="current-password">
<div class="actions"><button id="load">Charger les contenus</button><a class="btn" href="/" target="_blank">Voir le site</a></div><div id="status" class="status"></div></div>
<div id="editors"></div>
</main>
<script>
const sections=[['agenda','Agenda'],['sorties','Sorties & voyages'],['besoin','J’ai besoin de…']];
const $=s=>document.querySelector(s), status=t=>$('#status').textContent=t;
function makeEditor(id,label,html){
 const wrap=document.createElement('section'); wrap.className='card';
 wrap.innerHTML=`<label>${label}</label><div class="toolbar">
 <button type="button" data-cmd="italic">Italique</button><button type="button" data-cmd="bold">Gras</button>
 </div><div class="editor" id="ed-${id}" contenteditable="true"></div>`;
 wrap.querySelector('.editor').innerHTML=html;
 wrap.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>document.execCommand(b.dataset.cmd)));
 return wrap;
}
async function currentSections(){
 const text=await fetch('/',{cache:'no-store'}).then(r=>r.text());
 const doc=new DOMParser().parseFromString(text,'text/html'), out={};
 sections.forEach(([id])=>{const e=doc.getElementById(id); if(e) out[id]=e.innerHTML});
 return out;
}
$('#load').addEventListener('click',async()=>{
 status('Chargement…');
 try{
   const saved=await fetch('/content',{cache:'no-store'}).then(r=>r.ok?r.json():{});
   const base=await currentSections(); const data={...base,...saved};
   $('#editors').innerHTML='';
   sections.forEach(([id,label])=>$('#editors').appendChild(makeEditor(id,label,data[id]||'')));
   const save=document.createElement('div'); save.className='actions';
   save.innerHTML='<button id="save">Enregistrer les modifications</button><button class="secondary" id="reload">Annuler / recharger</button>';
   $('#editors').appendChild(save);
   $('#reload').onclick=()=>$('#load').click();
   $('#save').onclick=saveAll;
   status('Contenus chargés.');
 }catch(e){status('Impossible de charger les contenus. Vérifiez la configuration Cloudflare.')}
});
async function saveAll(){
 const pw=$('#pw').value; if(!pw){status('Saisissez le mot de passe administrateur.');return}
 const data={}; sections.forEach(([id])=>{const e=$('#ed-'+id); if(e)data[id]=e.innerHTML});
 status('Enregistrement…');
 const r=await fetch('/content',{method:'PUT',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify(data)});
 status(r.ok?'Modifications enregistrées.':'Échec : '+(await r.text()));
}
</script></body></html>
