<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Événement · Agenda du collège & du lycée</title><style>
:root{--blue:#355f78;--soft:#6f91a6;--ivory:#fbfaf7}*{box-sizing:border-box}body{margin:0;background:var(--ivory);font:15px/1.65 Arial,sans-serif;color:#334a58}.top{background:var(--soft);color:white;padding:20px max(20px,calc((100% - 830px)/2));font-size:12px;letter-spacing:.1em;font-weight:bold}main{max-width:830px;padding:32px 22px;margin:auto}a{color:var(--blue)}.back{font-size:13px;font-weight:bold;text-decoration:none}.box{background:#f0eee7;margin:26px 0;padding:32px 35px;border-bottom:4px solid var(--soft)}.date{color:var(--blue);font-size:15px;font-weight:bold}.box h1{font:normal clamp(28px,5vw,43px)/1.2 Georgia,serif;color:var(--blue);margin:14px 0}.description{font-size:16px;line-height:1.75;white-space:pre-wrap}.extra{background:#fff;padding:18px 22px;margin-top:18px;border-left:3px solid var(--soft)}.extra a{overflow-wrap:anywhere}.fine{font-size:12px;color:#687880}@media(max-width:600px){.box{padding:24px 21px}}
</style></head><body><div class="top">COLLÈGE SÉVIGNÉ · ENSEIGNEMENT SECONDAIRE</div><main><a class="back" href="/">← Retour à l’agenda complet</a><section class="box"><div class="date" id="date">Chargement…</div><h1 id="title">Événement de l’agenda</h1><div class="description" id="desc"></div><div class="extra" id="links" hidden></div></section><p class="fine">Informations issues de l’agenda du collège et du lycée, susceptibles d’être actualisées.</p></main><script>
const p=new URLSearchParams(location.search),wantedDate=p.get('date'),wantedTitle=p.get('titre');const clean=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];const days=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
(async()=>{try{if(!wantedDate||!wantedTitle)throw Error('Lien incomplet');const r=await fetch('/',{cache:'no-store'});if(!r.ok)throw Error('Agenda inaccessible');const doc=new DOMParser().parseFromString(await r.text(),'text/html');const cards=[...doc.querySelectorAll('#agenda .sev-date-card')];const item=cards.find(c=>{const date=c.querySelector('.sev-date strong')?.textContent||'',title=c.querySelector('.sev-date-content h3')?.textContent||'';const m=date.match(/(\d{1,2})\/(\d{1,2})/);return m&&('2026-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'))===wantedDate&&clean(title)===clean(wantedTitle)});if(!item)throw Error('Cet événement n’a pas été retrouvé dans l’agenda actuel');const date=new Date(wantedDate+'T12:00:00'),time=item.querySelector('.sev-date span')?.textContent?.trim()||'';document.querySelector('#date').textContent=days[date.getDay()].replace(/^./,x=>x.toUpperCase())+' '+date.getDate()+' '+months[date.getMonth()]+' '+date.getFullYear()+(time?' · '+time:'');const heading=item.querySelector('.sev-date-content h3')?.textContent?.trim()||wantedTitle;document.querySelector('#title').textContent=heading;document.title=heading+' · Collège Sévigné';document.querySelector('#desc').textContent=[...item.querySelectorAll('.sev-date-content p')].map(n=>n.textContent.trim()).join('\n\n');const linkWrap=document.querySelector('#links');item.querySelectorAll('.sev-date-content a[href]').forEach(a=>{const href=a.getAttribute('href');if(!href||href.startsWith('javascript:'))return;let l=document.createElement('a');l.textContent=a.textContent.trim()||'Document associé';if(href.startsWith('data:')){l.href=href;l.download=a.getAttribute('download')||'document'}else{l.href=new URL(href,'https://sevigne-la-semaine.pages.dev/').href;l.target='_blank';l.rel='noopener noreferrer'}let d=document.createElement('div');d.append(l);linkWrap.append(d)});linkWrap.hidden=!linkWrap.children.length}catch(e){document.querySelector('#date').textContent='Information indisponible';document.querySelector('#title').textContent='Événement introuvable';document.querySelector('#desc').textContent=e.message+'. Retournez à l’agenda complet.'}})();
</script></body></html>
